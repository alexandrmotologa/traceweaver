<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.1" />
    </linearGradient>

    <!-- Thread Gradients -->
    <linearGradient id="cyanThread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="amberThread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="emeraldThread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="indigoThread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Loom Grid / Timeline Marks (Subtle) -->
  <g opacity="0.15" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 8">
    <line x1="120" y1="90" x2="120" y2="422" />
    <line x1="200" y1="90" x2="200" y2="422" />
    <line x1="280" y1="90" x2="280" y2="422" />
    <line x1="360" y1="90" x2="360" y2="422" />
    <line x1="440" y1="90" x2="440" y2="422" />
  </g>

  <!-- Thread 1: Ingress Gateway Span -->
  <g>
    <!-- Glow Underlay -->
    <path d="M 80 160 H 220 C 250 160 270 200 270 230 V 270" fill="none" stroke="#38BDF8" stroke-width="14" opacity="0.3" filter="url(#glow)" />
    <!-- Core Path -->
    <path d="M 80 160 H 220 C 250 160 270 200 270 230 V 270" fill="none" stroke="url(#cyanThread)" stroke-width="8" stroke-linecap="round" />
    <circle cx="80" cy="160" r="7" fill="#38BDF8" />
    <circle cx="220" cy="160" r="6" fill="#818CF8" />
  </g>

  <!-- Thread 2: Database Outbox / Transaction Span -->
  <g>
    <path d="M 180 220 H 280 C 310 220 330 250 330 280 V 320" fill="none" stroke="#818CF8" stroke-width="14" opacity="0.25" filter="url(#glow)" />
    <path d="M 180 220 H 280 C 310 220 330 250 330 280 V 320" fill="none" stroke="url(#indigoThread)" stroke-width="8" stroke-linecap="round" />
    <circle cx="180" cy="220" r="7" fill="#818CF8" />
    <circle cx="280" cy="220" r="6" fill="#C084FC" />
  </g>

  <!-- Thread 3: Asynchronous Queue Dwell Time (The Weaving Loom Bridge) -->
  <g>
    <!-- Dwell Time Bridge (Dotted Hatched Weave) -->
    <rect x="250" y="270" width="100" height="24" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 3" />
    <!-- Dwell Time Hatch Pattern -->
    <path d="M 260 294 L 272 270 M 276 294 L 288 270 M 292 294 L 304 270 M 308 294 L 320 270 M 324 294 L 336 270" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Thread 4: Consumer & Causal Completion -->
  <g>
    <path d="M 320 340 H 440" fill="none" stroke="#34D399" stroke-width="14" opacity="0.3" filter="url(#glow)" />
    <path d="M 320 340 H 440" fill="none" stroke="url(#emeraldThread)" stroke-width="8" stroke-linecap="round" />
    <circle cx="320" cy="340" r="7" fill="#F59E0B" />
    <circle cx="440" cy="340" r="8" fill="#10B981" />
  </g>

  <!-- Loom Warp Connectors (Vertical Causal Weave Lines) -->
  <g stroke="#E2E8F0" stroke-width="2" stroke-dasharray="3 3" opacity="0.4">
    <line x1="220" y1="166" x2="220" y2="214" />
    <line x1="280" y1="226" x2="280" y2="268" />
    <line x1="330" y1="294" x2="330" y2="334" />
  </g>

  <!-- Central Pulse Node (Convergence) -->
  <circle cx="280" cy="220" r="14" fill="#6366F1" fill-opacity="0.3" filter="url(#glow)" />
  <circle cx="280" cy="220" r="5" fill="#FFFFFF" />
</svg>
