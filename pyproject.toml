[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceweaver"
version = "0.1.0"
description = "Distributed trace correlator and causal event waterfall visualizer with sub-millisecond DuckDB analytics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexandru Motologa" }
]
keywords = [
    "opentelemetry",
    "distributed-tracing",
    "duckdb",
    "textual",
    "tui",
    "waterfall",
    "dwell-time",
    "kafka",
    "causal-graph",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "duckdb>=1.0.0",
    "textual>=0.80.0",
    "rich>=13.8.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "opentelemetry-proto>=1.25.0",
    "grpcio>=1.65.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
traceweaver = "traceweaver.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/traceweaver"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
